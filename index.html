<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识管理 - 资料整理</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>知日方营销平台</h2>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span>首页</span>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">内容管理</div>
                    <div class="nav-item active">
                        <span class="nav-icon">📚</span>
                        <span>知识文库管理</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">📖</span>
                        <span>课程管理</span>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 页面头部 -->
            <header class="page-header">
                <div class="header-info">
                    <h1>资料整理</h1>
                    <p class="subtitle">查看和管理这个目录的知识点，主流课程和知识</p>
                </div>
                <button class="btn-primary" id="uploadBtn">
                    <span>+</span> 上传新文档
                </button>
            </header>

            <!-- 搜索栏 -->
            <div class="search-bar">
                <input type="text" placeholder="搜索文档名称..." id="searchInput">
                <span class="search-icon">🔍</span>
            </div>

            <!-- 文档列表 -->
            <div class="document-list">
                <table>
                    <thead>
                        <tr>
                            <th>文档名称</th>
                            <th>状态</th>
                            <th>知识点数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="documentTable">
                        <!-- 文档行将通过 JavaScript 动态生成 -->
                    </tbody>
                </table>
            </div>

            <!-- 分页控件 -->
            <div class="pagination">
                <div class="pagination-info">
                    共 <span id="totalCount">11</span> 条，每页 <span id="pageSize">10</span> 条
                </div>
                <div class="pagination-controls">
                    <button class="page-btn" id="prevPage">&lt;</button>
                    <button class="page-btn active" data-page="1">1</button>
                    <button class="page-btn" data-page="2">2</button>
                    <button class="page-btn" id="nextPage">&gt;</button>
                    <span class="jump-to">跳至</span>
                    <input type="number" class="page-input" id="pageInput" min="1" max="2">
                    <span>页</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 文档数据
        const documents = [
            { id: 1, name: '关于 AI 和记忆系统.pdf', status: 100, knowledgePoints: 27 },
            { id: 2, name: '客户跟踪清单', status: 100, knowledgePoints: 18 },
            { id: 3, name: '如何零产品营销技能-for销售新人培训', status: 100, knowledgePoints: 24 },
            { id: 4, name: '5分钟介绍新零售for销售新人培训', status: 100, knowledgePoints: 9 },
            { id: 5, name: '5分钟介绍新零售for销售新人培训', status: 100, knowledgePoints: 9 },
            { id: 6, name: '了解有预缴的业务-2024年5月版【四字幕】', status: 100, knowledgePoints: 1 },
            { id: 7, name: '了解有预缴的业务-2024年5月版【四字幕】', status: 100, knowledgePoints: null },
            { id: 8, name: '了解有预缴的业务-2024年5月版【四字幕】', status: 100, knowledgePoints: null },
            { id: 9, name: '了解有预缴的业务-2024年5月版【四字幕】', status: 100, knowledgePoints: null },
            { id: 10, name: '5分钟介绍新零售for销售新人培训', status: 100, knowledgePoints: null }
        ];

        // 渲染文档列表
        function renderDocuments(docs) {
            const tbody = document.getElementById('documentTable');
            tbody.innerHTML = '';

            docs.forEach(doc => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="doc-name">${doc.name}</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${doc.status}%"></div>
                        </div>
                    </td>
                    <td class="text-center">${doc.knowledgePoints !== null ? doc.knowledgePoints : '-'}</td>
                    <td class="actions">
                        <button class="btn-link btn-view">查看</button>
                        <button class="btn-link btn-delete">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 添加操作按钮事件
            document.querySelectorAll('.btn-view').forEach(btn => {
                btn.addEventListener('click', function() {
                    alert('查看文档功能');
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (confirm('确定要删除这个文档吗？')) {
                        alert('删除文档功能');
                    }
                });
            });
        }

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = documents.filter(doc => 
                doc.name.toLowerCase().includes(searchTerm)
            );
            renderDocuments(filtered);
        });

        // 上传按钮
        document.getElementById('uploadBtn').addEventListener('click', function() {
            alert('上传新文档功能');
        });

        // 分页功能
        document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                // 这里可以添加实际的分页逻辑
            });
        });

        // 跳页功能
        document.getElementById('pageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const page = parseInt(this.value);
                if (page >= 1 && page <= 2) {
                    alert(`跳转到第 ${page} 页`);
                }
            }
        });

        // 初始化渲染
        renderDocuments(documents);
    </script>
</body>
</html>
